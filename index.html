<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기엽쌤의 업무도구</title>
  <meta name="description" content="수업과 학교 업무를 하다가 필요해서 직접 만든 도구 모음 · by 김기엽">
  <meta property="og:title" content="기엽쌤의 업무도구">
  <meta property="og:description" content="수업과 학교 업무에 바로 쓰는 도구 모음 · by 김기엽">
  <meta name="theme-color" content="#3F6B52">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <header class="hero">
    <!-- 머리말 배경의 코트 라인. 진하기는 theme.css의 --court-opacity로 조절 -->
    <svg class="court" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="#fff" stroke-width="3">
      <rect x="40" y="30" width="1120" height="340" rx="4"/>
      <line x1="600" y1="30" x2="600" y2="370"/>
      <circle cx="600" cy="200" r="70"/><circle cx="600" cy="200" r="5" fill="#fff"/>
      <path d="M40 110h150v180H40"/><path d="M1160 110h-150v180h150"/>
      <path d="M190 140a60 60 0 0 1 0 120"/><path d="M1010 140a60 60 0 0 0 0 120"/>
    </svg>
    <div class="hero-in">
      <h1 class="site-name" id="siteName">기엽쌤의 업무도구</h1>
      <p class="intro" id="intro"></p>
      <p class="byline" id="byline"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="finder">
      <label class="search">
        <span class="sr-only">프로그램 찾기</span>
        <input id="q" type="search" placeholder="프로그램 찾기 (예: 수행평가, 급식)" autocomplete="off">
      </label>
      <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
    </div>
    <ul class="cards" id="cards"></ul>
    <p class="empty" id="empty" hidden>찾는 프로그램이 없어요. 다른 낱말로 찾아보세요.</p>
  </main>

  <footer class="foot"><div class="wrap" id="footText"></div></footer>
  <script src="js/main.js"></script>
</body>
</html>
