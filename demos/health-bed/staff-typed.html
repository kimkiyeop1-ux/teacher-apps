<!doctype html>
<html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>보건실 침상 알리미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#1B2421; --ink2:#33403D; --muted:#4F5B58; --line:#D5DCD9; --line2:#ECEFEE;
  --green:#0B6B57; --green-ink:#0B5A49; --green-soft:#E3F2EC; --green-chip:#CDE9E0; --green-pale:#EAF5F1; --green-dash:#6FB3A1;
  --warm:#B4561A; --warm-ink:#7A3A08; --warm-soft:#FFF4EA; --warm-chip:#F6E2D1; --warm-line:#D0711F;
  --full:#5E4A3D; --full-soft:#F1E4DA; --gray:#D5DCD9;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:var(--green)}
:focus-visible{outline:3px solid #2E6FD8;outline-offset:2px}
.wrap{max-width:1216px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
@media (min-width:760px){.wrap{padding:28px 32px 48px;gap:24px}}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
@media (min-width:760px){.brand h1{font-size:26px}}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--green-chip);color:var(--green-ink)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--green);font-weight:700;min-height:44px;padding:0 6px;text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
h2{margin:0;font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.use{background:var(--warm-chip);color:var(--warm-ink)}
.chip.free{background:var(--green-chip);color:var(--green-ink)}
.btn{min-height:52px;border-radius:12px;font-weight:800;font-size:17px;padding:0 18px;border:0}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:disabled{background:var(--gray);color:var(--muted)}
.btn.line{background:#fff;border:1px solid var(--ink);color:var(--ink)}
.btn.soft{background:#fff;border:1px solid #C9B39E;color:#6B3A10}
.btn.big{min-height:64px;font-size:20px}
.sid{font-weight:800;letter-spacing:-.3px}
.sidsub{font-weight:500;color:var(--muted);font-size:.6em;margin-left:6px}
/* 사용 가능 카드 */
.avail{border-radius:20px;padding:24px;color:#fff;background:var(--green);display:flex;justify-content:space-between;align-items:center;gap:12px}
.avail.zero{background:var(--full)}
.avail.closed{background:#55615E}
.avail .lab{font-size:15px;font-weight:700;opacity:.92}
.avail .num{font-size:64px;font-weight:800;line-height:1}
.avail .of{font-size:24px;font-weight:700;opacity:.85}
@media (min-width:760px){.avail .num{font-size:88px}}
/* 교직원 레이아웃 */
.cols{display:flex;flex-wrap:wrap;gap:20px}
.col-l{flex:1 1 360px;display:flex;flex-direction:column;gap:20px;min-width:0}
.col-r{flex:2 1 520px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.sidinput{min-height:60px;border:2px solid var(--green);border-radius:12px;padding:0 14px;font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;width:100%;background:#fff}
.preview{border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700;text-align:center;background:var(--green-soft);color:var(--green-ink)}
.preview.bad{background:var(--warm-soft);color:var(--warm-ink)}
.preview.empty{background:var(--line2);color:var(--muted);font-weight:500}
.mine{display:flex;flex-direction:column;gap:8px}
.minerow{border-radius:12px;padding:12px 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.minerow.wait{background:var(--warm-soft);color:#6B3A10}
.minerow.ok{background:var(--green-soft);color:var(--green-ink)}
.minerow.no{background:var(--line2);color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:17px}
th{text-align:left;color:var(--muted);font-size:14px;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
td.dim{color:var(--muted)}
td:first-child,th{white-space:nowrap}
@media (max-width:600px){
  table{font-size:15px}
  th,td{padding:10px 6px}
  td .sidsub{display:block;margin-left:0;font-size:13px}
}
/* 보건 */
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;font-weight:700}
.seg button.away[aria-pressed="true"]{background:#55615E}
.reqs{display:flex;flex-direction:column;gap:12px}
.req{background:var(--warm-soft);border:2px solid var(--warm-line);border-radius:var(--r);padding:18px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.req.fresh{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(208,113,31,.25)}}
.req .who{display:flex;flex-direction:column;gap:4px}
.req .when{font-size:14px;font-weight:700;color:var(--warm-ink)}
.req .acts{display:flex;gap:10px;flex-wrap:wrap}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.bed{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.bed.free{background:var(--green-pale);border:2px dashed var(--green-dash)}
.bed .hd{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--muted)}
.bed .sid{font-size:30px}
.bed .act{margin-top:auto}
.bed .act .btn{width:100%}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.stepper output{min-width:56px;text-align:center;font-weight:800;font-size:18px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,28,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
@media (min-width:760px){.modal{align-items:center;padding:24px}}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:100vh;overflow:auto}
@media (min-width:760px){.sheet{border-radius:22px}}
.sheet .head{display:flex;justify-content:space-between;align-items:center}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keypad button{min-height:56px;border:0;border-radius:12px;background:var(--bg);font-size:24px;font-weight:700}
.txt{min-height:52px;border:1px solid #B9C3C0;border-radius:12px;padding:0 14px;font-size:18px;width:100%;background:#fff}
.txt.strong{border:2px solid var(--green);font-weight:700;font-size:20px}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.examples button{font-size:13px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);min-height:36px}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warm-soft);color:#6B3A10}
.msg.info{background:var(--green-soft);color:var(--green-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B2421;color:#fff;border-radius:14px;padding:14px 18px;font-size:15px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:#9EE0CB;font-weight:800;min-height:40px;font-size:15px;text-decoration:underline}
.sync{font-size:13px;color:var(--muted)}
.sync.err{color:var(--warm-ink);font-weight:700}
.setup{max-width:440px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:20px;min-height:100vh}
.setup h1{margin:0;font-size:24px;font-weight:800}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div id="app">
  <main class="wrap">
    <header class="top">
    <div class="brand"><span style="color:var(--green)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V8"></path><path d="M3 14h18v4"></path><path d="M21 14v-2a3 3 0 0 0-3-3h-7v5"></path><circle cx="7" cy="11" r="2"></circle></svg></span><h1>보건실 침상 알리미</h1></div>
    <div class="me"><span>내 표시: <b>2-3 담임</b></span><button class="linkbtn" type="button" data-act="openSettings">설정</button></div>
  </header>
    <div class="cols">
      <div class="col-l">
        <div id="avail" class="avail" aria-live="polite"><div style="display:flex;flex-direction:column;gap:6px"><span class="lab">지금 사용 가능한 침상</span><span class="small" style="opacity:.9">보건실 운영 중</span></div>
    <div style="display:flex;align-items:baseline;gap:8px"><span class="num">2</span><span class="of">/ 4</span></div></div>
        <section class="card" style="display:flex;flex-direction:column;gap:14px" aria-label="침상 안정 요청">
          <h2>침상 안정 요청</h2>
          <form id="reqForm" style="display:flex;flex-direction:column;gap:12px" autocomplete="off">
            <label class="field">학번 4자리
              <input class="sidinput" id="sidIn" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="2305" aria-describedby="sidPrev" style="">
            </label>
            <div id="sidPrev"><div class="preview">2학년 3반 5번 학생</div></div>
            <button class="btn primary big" id="reqBtn" type="submit">요청 보내기 · 2305</button>
          </form>
          <div id="mine" class="mine"></div>
        </section>
      </div>
      <section class="card col-r" style="display:flex;flex-direction:column;gap:12px" aria-label="보건실에 있는 학생">
        <div class="top"><h2>지금 보건실에 있는 학생</h2><span class="sync" id="sync">10:35 기준 · 자동 갱신</span></div>
        <div style="overflow-x:auto"><table><thead><tr><th>침상</th><th>학번</th><th>입실</th><th>상태</th></tr></thead><tbody id="list"><tr><td>1번</td><td style="font-size:20px"><span class="sid">1101</span><span class="sidsub">1학년 1반 1번</span></td><td>10:03</td><td><span class="chip use">사용 중</span></td></tr><tr><td>2번</td><td style="font-size:20px"><span class="sid">3214</span><span class="sidsub">3학년 2반 14번</span></td><td>10:24</td><td><span class="chip use">사용 중</span></td></tr><tr><td class="dim">3번</td><td class="dim">—</td><td class="dim">—</td><td><span class="chip free">비어 있음</span></td></tr><tr><td class="dim">4번</td><td class="dim">—</td><td class="dim">—</td><td><span class="chip free">비어 있음</span></td></tr></tbody></table></div>
      </section>
    </div>
  </main></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>



</body></html>
