<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>급식지도 알리미</title>
<meta name="theme-color" content="#1F4FD1">



<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="급식지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<!-- 글꼴은 화면을 먼저 그린 뒤에 불러옴 (첫 화면을 막지 않도록) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" media="all">
<style>
:root {
  --bg: #F4F6F9; --card: #FFFFFF; --ink: #172033; --ink2: #3A4354; --muted: #5B6474; --line: #D6DCE5;
  --blue: #1F4FD1; --blue-ink: #163A9C; --blue-soft: #E7EEFF;
  --orange: #B45309; --orange-soft: #FFF7EE; --chip: #E4E8EE;
  --hot: #E8792B; --green: #0F7A55; --green-soft: #E3F5EC;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
.me { font-size: 13px; font-weight: 500; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; min-height: 36px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 700; border-radius: 8px; padding: 5px 10px; }
.chip.blue { color: var(--blue); background: var(--blue-soft); }
.chip.gray { color: var(--ink); background: var(--chip); }

.banner { display: flex; gap: 12px; align-items: center; border-radius: 14px; padding: 14px 16px; }
.banner.dark { background: var(--ink); color: #fff; }
.banner.dark small { color: #C9D1DE; }
.banner.blue { background: var(--blue-soft); color: var(--blue-ink); }
.banner.warn { background: var(--orange-soft); color: #7A3906; border: 1px solid #F1C99E; }
.banner b { font-size: 15px; display: block; }
.banner small { font-size: 13px; display: block; margin-top: 2px; }
.banner svg { flex-shrink: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 12px; border-radius: 16px; padding: 16px; background: var(--card); border: 1px solid var(--line); }
.card.active { background: var(--orange-soft); border: 2px solid var(--orange); padding: 15px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-head .pos { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 8px; }
.card-head .gname { font-size: 22px; font-weight: 900; }
.badge { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.badge.done { background: var(--blue-soft); color: var(--blue-ink); }
.badge.active { background: var(--orange); color: #fff; }
.badge.wait { background: var(--chip); color: var(--ink2); }
.meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); }
.meta b { color: var(--ink); }
.label { font-size: 12px; font-weight: 500; color: var(--muted); }
.classes { display: grid; gap: 4px; }
.classes span { height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 15px; font-weight: 700; background: var(--bg); }
.classes span.first { background: var(--ink); color: #fff; }
.empty { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }

.btn { height: 56px; border: none; border-radius: 12px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 700; width: 100%; }
.btn:disabled { opacity: .6; cursor: wait; }
.btn.line { background: var(--card); color: var(--blue); border: 2px solid var(--blue); }
.btn.off, .btn.off:disabled { opacity: 1; background: var(--chip); color: var(--muted); cursor: not-allowed; font-size: 16px; }
.link { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 10px; align-self: center; min-height: 44px; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--line); padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 500; min-height: 44px; }
.nav a[aria-current="page"] { color: var(--blue); font-weight: 700; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 15px; font-weight: 700; }
.help { font-size: 13px; color: var(--ink2); line-height: 1.6; margin: 0; }
.pick { display: grid; gap: 6px; }
.pick button { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; font-weight: 500; }
.pick button[aria-pressed="true"] { border: 2px solid var(--blue); background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; }
.pick.small button { height: 40px; border-radius: 8px; font-weight: 700; }
.pick.small button[aria-pressed="true"] { border: none; background: var(--ink); color: #fff; }
.field { height: 48px; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 16px; color: var(--ink); background: #F9FAFC; }
.duty { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.duty .h { font-size: 13px; font-weight: 700; text-align: center; }
.duty .d { font-size: 14px; font-weight: 700; color: var(--ink2); }
.duty input { height: 42px; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font-size: 15px; color: var(--ink); background: #F9FAFC; }
.err { color: #9A2B12; font-size: 14px; font-weight: 500; margin: 0; }

/* ---- 오늘 화면 (타임라인) ---- */
.hdr { background: var(--blue); color: #fff; border-radius: 0 0 22px 22px; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 18px; }
.hin { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.hdr .eyebrow { color: #C9D6FF; }
.hdr .topr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hdr .me { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.35); color: #fff; }
.hdr .chip { color: #fff; background: rgba(255,255,255,.16); }
.wrap.tlw { max-width: 680px; padding-top: 16px; }
.tl { position: relative; padding-left: 32px; display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; }
.tl::before { content: ""; position: absolute; left: 12px; top: 18px; bottom: 26px; width: 2px; background: var(--line); }
.node { position: relative; }
.node .pin { position: absolute; left: -32px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: var(--muted); }
.node.done .pin { background: var(--green); border-color: var(--green); color: #fff; }
.node.active .pin { background: var(--hot); border-color: var(--hot); color: #fff; box-shadow: 0 0 0 4px #FCD9BD; }
.tc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.node.active .tc { border: 2px solid var(--hot); padding: 13px 15px; }
.node.open:not(.active) .tc { border: 2px solid var(--blue); padding: 13px 15px; }
.th { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 28px; }
.th .gname { font-size: 20px; font-weight: 900; }
.th .who { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.mine { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 6px; padding: 2px 7px; margin-left: 6px; vertical-align: 3px; }
.pill { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.pill.done { background: var(--green-soft); color: var(--green); }
.pill.active { background: var(--hot); color: #fff; }
.pill.wait { background: var(--chip); color: var(--ink2); }
.go { word-break: keep-all; font-size: 15px; font-weight: 700; color: var(--orange); background: var(--orange-soft); border-radius: 10px; padding: 10px 12px; }
.sub { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 10; max-width: calc(100% - 32px); }
.center { min-height: 60vh; display: flex; align-items: center; justify-content: center; color: var(--muted); }

@media (min-width: 900px) {
  .wrap { padding: 40px 24px 40px; gap: 20px; }
  h1 { font-size: 36px; letter-spacing: -1px; }
  .eyebrow { font-size: 15px; }
  .card { padding: 24px; gap: 18px; }
  .card.active { padding: 23px; }
  .card-head .gname { font-size: 30px; }
  .meta { font-size: 16px; }
  .nav { position: static; display: flex; gap: 8px; background: none; border: none; padding: 0; justify-content: flex-end; }
  .nav a { flex-direction: row; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 15px; }
  .toast { bottom: 32px; }
  .narrow { max-width: 560px; }
  .hdr { padding: 32px 24px 24px; border-radius: 0 0 28px 28px; }
  .hdr .nav a { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); color: #fff; }
  .hdr .nav a[aria-current="page"] { background: #fff; color: var(--blue); }
  .wrap.tlw { padding-top: 24px; }
  .th .gname { font-size: 24px; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
</style>
</head>
<body>
<div id="app"><header class="hdr"><div class="hin">
      <div class="top">
        <div><div class="eyebrow">급식지도 알리미</div><h1>11월 27일 금요일</h1></div>
        <div class="topr"><nav class="nav" aria-label="메뉴">
    <a href="#" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>오늘</a>
    <a href="#settings"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>학년 설정</a>
  </nav><button class="me" id="changeMe">김하늘 · 3학년</button></div>
      </div><div class="chips">
      <span class="chip">11월 순서 3 → 2 → 1학년</span>
      <span class="chip">3학년 이번 주 A조</span>
      
    </div>
    </div></header><div class="wrap tlw"><ol class="tl"><li class="node active open" aria-label="1번째 3학년 진행 중">
      <span class="pin">1</span>
      <section class="tc"><div class="th"><span><span class="gname">3학년</span><span class="mine">내 학년</span></span><span class="pill active">진행 중</span></div><div class="meta"><span>담당 <b>김하늘</b></span><span>참고 시간 12:25</span></div><div class="label">학급 입장 순서</div><div class="classes" style="grid-template-columns:repeat(8,minmax(0,1fr))"><span class="first">5</span><span class="">6</span><span class="">7</span><span class="">8</span><span class="">1</span><span class="">2</span><span class="">3</span><span class="">4</span></div><button class="btn" data-done="3">3학년 급식지도 완료</button></section>
    </li><li class="node wait" aria-label="2번째 2학년 대기">
      <span class="pin">2</span>
      <section class="tc"><div class="th"><span><span class="gname">2학년</span><span class="who">· 이바다</span></span><span class="pill wait">대기 · 12:35</span></div></section>
    </li><li class="node wait" aria-label="3번째 1학년 대기">
      <span class="pin">3</span>
      <section class="tc"><div class="th"><span><span class="gname">1학년</span><span class="who">· 박구름</span></span><span class="pill wait">대기 · 12:45</span></div></section>
    </li></ol></div></div>

<!-- Firebase (알림용) : 버전 고정. defer = 화면을 먼저 그리고 나서 실행 -->





</body></html>
